<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Calculator</title>
</head>
<body>
    <div class="container">
        <div class="display">
            <input type="text" readonly>
        </div>
        <div class="keys">
            <button id="opkey">C</button>
            <button>7</button>
            <button>8</button>
            <button>9</button>
            <button id="opkey">/</button>
            <button>4</button>
            <button>5</button>
            <button>6</button>
            <button id="opkey">*</button>
            <button>1</button>
            <button>2</button>
            <button>3</button>
            <button id="opkey">-</button>
            <button>0</button>
            <button>.</button>
            <button >⌫</button>
            <button id="opkey">+</button>
            <button id="equal">=</button>
            
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
