<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="dashboard.css">
    <title>Dashboard</title>
</head>

<body>
    <div class="nav">
        <div class="name">
            <img src="Assets/AuthGaurd.png" alt="">
            <h3>AuthGaurd</h3>
        </div>
        <div class="buttons">
            <button id="logoutBtn">Logout</button>
            <button id="deleteBtn">Delete account</button>
        </div>
    </div>
    <div class="hero">
        <h1 id="welcome"></h1>
        <p>Your personal security overview</p>
    </div>
    <div class="userProfile">
        <h3>User Profile</h3>
        <div class="fullName">
            <p>Full Name:</p>
            <p id="profName"></p>
        </div>
        <div class="email">
            <p>Email:</p>
            <p id="profEmail"></p>
        </div>
        <div class="role">
            <p>Role:</p>
            <p>Web developer</p>
        </div>
        <div class="status">
            <p>Status:</p>
            <p>active</p>
        </div>
    </div>

    <script src="register.js"></script>
</body>

</html>
