<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="register.css">
    <title>Register form</title>
</head>

<body>
    <!-- <div class="container"> -->
    <div class="nav">
        <img src="Assets/AuthGaurd.png" alt="">
        <h3>AuthGaurd</h3>
    </div>

    <div class="mainContent">

        <div class="illustration">
            <div class="herotext">
                <h1>Join AuthGaurd Today</h1>
                <p>Create your secure account and protect your data.</p>
            </div>
            <div class="image">
                <img src="Assets/illustration.png" alt="">
            </div>
        </div>

        <div class="formSide">
            <div class="form">

                <h2>Create Your Account</h2>
                <div class="info">
                    <div id="Username">
                        <p>Username</p>
                        <input type="text" placeholder="Enter username" id="username">
                    </div>
                    <div id="Email">
                        <p>Email Address</p>
                        <input type="text" placeholder="Your email" id="email">
                    </div>
                    <div id="Password">
                        <p>Password</p>
                        <input type="password" placeholder="password" id="password">
                    </div>
                    <div id="confirmPassword">
                        <p>Confirm Password</p>
                        <input type="password" placeholder="Confirm password" id="cPassword">
                    </div>
                    <div class="psection">
                        <p class="passInstr">Password must be at least 8 characters long, include
                            uppercase, lowercase, number, and special character.</p>
                    </div>
                    <button id="regButton">Register</button>
                    <div class="login">
                        <p>Already have an account? <a href="login.html">Login</a></p>

                    </div>
                </div>
                </form>
            </div>
        </div>
    </div>
    <!-- </div> -->


    <script src="register.js"></script>
</body>

</html>
