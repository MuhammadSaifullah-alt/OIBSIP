<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="login.css">
    <title>Document</title>
</head>

<body>
    <div class="formSide">
        <div class="form">

            <div class="name">
                <img src="Assets/AuthGaurd.png" alt="">
                <h3>AuthGaurd</h3>
            </div>

            <div class="greetings">
                <h2>Welcome back</h2>
                <p>Please enter your details</p>
            </div>

            <div class="info">
                <div id="Username">
                    <p>Username</p>
                    <input type="text" placeholder="Enter username" id="loginUser">
                </div>

                <div id="Password">
                    <p>Password</p>
                    <input type="password" placeholder="password" id="loginPassword">
                </div>

                <div id="forget">
                    <a href="">Forget password?</a>
                </div>
                <button id="loginBtn">Login</button>
                <div class="login">
                    <p>Don't have an account? <a href="register.html">Signup</a></p>

                </div>
            </div>
        </div>
    </div>

    <script src="register.js"></script>
</body>

</html>
